<div class="page page-center">
  <div class="container container-tight py-4">
    <ton-card>
      <div class="card-body">
        <h2 class="h2 text-center mb-4">Reset Password</h2>
        <ton-messages />
        <form autocomplete="off">
          @if (showCurrent()) {
          <div class="mb-4">
            <label for="current" class="form-label">Current Password</label>
            <input
              type="password"
              id="current"
              placeholder="Password"
              autocomplete="off"
              class="form-control"
              [formField]="resetForm.current"
            />
            <ton-validator-message [field]="resetForm.current"
              >Current password is required</ton-validator-message
            >
          </div>
          }
          <div class="mb-4">
            <label for="password" class="form-label"
              >New Password
              </label
            >
            <input
              type="password"
              id="password"
              placeholder="New password"
              autocomplete="off"
              class="form-control"
              [formField]="resetForm.password"
            />
            <ton-validator-message [field]="resetForm.password" validatorName="required"
              >Password is required</ton-validator-message
            >
            <ton-validator-message [field]="resetForm.password" validatorName="minlength">Password should be more than 8 chars</ton-validator-message>
          </div>
          <div class="mb-4">
            <label for="confirmPassword" class="form-label"
              >Confirm Password
              </label
            >
            <input
              type="password"
              id="confirmPassword"
              placeholder="Confirm password"
              autocomplete="off"
              class="form-control"
              [formField]="resetForm.confirmPassword"
            />
            <ton-validator-message [field]="resetForm.confirmPassword" validatorName="notMatched"
              >The password must match</ton-validator-message
            >
          </div>

          <div class="form-footer">
            <button
              type="button"
              class="btn btn-primary w-100"
              [disabled]="submitting()"
              (click)="save()"
            >
              Save
            </button>
          </div>
        </form>
      </div>
    </ton-card>
    <div class="text-center text-secondary mt-3">Return <a routerLink="/">home</a></div>
  </div>
</div>
