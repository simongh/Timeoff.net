<div class="page page-center">
  <div class="container container-tight py-4">
    <ton-card>
      <div class="card-body">
        <h2 class="h2 text-center mb-4">Forgot Password</h2>
        <ton-messages />
        <form autocomplete="off" [formGroup]="passwordForm">
            <div class="mb-3">
                <label for="email" class="form-label required">Email</label>
                <input type="email" placeholder="Email" formControlName="email" class="form-control" />
                <ton-validator-message controlName="email">A valid email is required</ton-validator-message>
            </div>
            <div class="form-footer">
                <button type="button" class="btn btn-primary w-100" [disabled]="submitting()" (click)="forgot()">Send instructions</button>
            </div>
        </form>
      </div>
    </ton-card>
    <div class="text-center text-secondary mt-3">Return to <a routerLink="/">sign in</a></div>
  </div>
</div>
