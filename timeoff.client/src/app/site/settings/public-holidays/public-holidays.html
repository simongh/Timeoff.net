<ton-page-header>
  <div class="page-pretitle">
    Public holidays for {{ company() }}'s account in {{ currentYear() }}
  </div>
  <h2>Public Holidays</h2>
</ton-page-header>

<div class="page-body">
  <div class="container-xl">
    <div class="row row-deck row cards">
      <div class="col-lg-9">
        <ton-card>
          <div class="card-header">
            <div class="container-xl">
              <div class="row">
                <div class="col">
                  <a class="btn" routerLink="." [queryParams]="{ year: lastYear() }"><fa-icon [icon]="faChevronLeft"/> {{
                    lastYear()
                  }}</a>
                  
                </div>
                <div class="col text-end">
                  <a class="btn" routerLink="." [queryParams]="{ year: nextYear() }">{{
                    nextYear()
                  }} <fa-icon [icon]="faChevronRight"/></a>
                </div>
              </div>
            </div>
          </div>
          <div class="card-body">
            <ton-calendar [start]="start()" [monthCount]="12" [events]="holidays.value()?? []" colStyle="col-md-4"></ton-calendar>
          </div>
        </ton-card>
      </div>
      <div class="col">
        <ton-card>
          <div class="card-body">
            {{form.length}}
            @for (item of form; track $index) {
              <input type="text" [formField]="form[$index].date"/>
              <input type="text" [formField]="form[$index].name"/>
              <hr/>
            }
          </div>
        </ton-card>
      </div>
    </div>
  </div>
</div>
