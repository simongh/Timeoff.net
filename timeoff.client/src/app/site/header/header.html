<header class="navbar navbar-expand-md navbar-light d-print-none">
  <div class="container-xl">
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbar-menu"
      aria-controls="navbar-menu"
      aria-expanded="false"
      aria-label="Toggle Navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
      <a href="/">TimeOff</a>
    </div>

    <div class="navbar-nav flex-row order-md-last">
      <div class="d-none d-md-flex">
        <div class="nav-item">
          <a class="nav-link" href="."
            ><span class="nav-link-icon"><svg bell></svg></span
          ></a>
        </div>
        @if (isAdmin()) {
        <div class="nav-item" ngbDropdown>
          <a class="nav-link" ngbDropdownToggle
            ><span class="nav-link-icon"><svg settings></svg></span
          ></a>
          <div class="dropdown-menu" ngbDropdownMenu>
            <a ngbDropdownItem routerLink="/settings">General</a>
            <div class="dropdown-divider"></div>
            <a ngbDropdownItem href=".">Teams</a>
            <a ngbDropdownItem href=".">Public Holidays</a>
            <a ngbDropdownItem href=".">Import employees</a>
            <div class="dropdown-divider"></div>
            <a ngbDropdownItem href=".">Email audit</a>
            <a ngbDropdownItem href=".">Reports</a>
          </div>
        </div>
        }
      </div>
      <div class="nav-item" ngbDropdown>
        <a class="nav-link" ngbDropdownToggle aria-label="Open user menu">
          <span class="avatar avatar-sm"><svg user-circle></svg></span>
          <div class="d-none d-xl-block ps-2">
            <div>{{ username() }}</div>
          </div>
        </a>
        <div ngbDropdownMenu class="dropdown-menu">
          <a ngbDropdownItem href=".">Requests</a>
          <a ngbDropdownItem href=".">Feeds</a>
          <a ngbDropdownItem routerLink="./reset-password">Change Password</a>
          <div class="dropdown-divider"></div>
          <a ngbDropdownItem routerLink="/logout">Logout</a>
        </div>
      </div>
    </div>

    <div id="navbar-menu" class="collapse navbar-collapse">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a href="." class="nav-link"
            ><span class="nav-link-icon"><svg calendar-week></svg></span>
            <span class="nav-link-title">Calendar</span></a
          >
        </li>
        @if (showTeamView()) {
        <li class="nav-item">
          <a href="." class="nav-link"
            ><span class="nav-link-icon"><svg file-report></svg></span
            ><span class="nav-link-title">Team View</span>
          </a>
        </li>
        } @if (isAdmin()) {
        <li class="nav-item">
          <a routerLink="/users" class="nav-link"
            ><span class="nav-link-icon"><svg users></svg></span
            ><span class="nav-link-title">Employees</span></a
          >
        </li>
        }
        <li class="nav-item ">
          <button class="btn btn-info ms-3" type="button">New absence</button>
        </li>
      </ul>
    </div>
  </div>
</header>
