<div class="page page-center">
  <div class="container container-tight py-4">
    <ton-card>
      <div class="card-body">
        <h2 class="h2 text-center mb-4">Register new company account</h2>
        <ton-messages />
        <form autocomplete="off">
          <div class="mb-3">
            <label for="companyName" class="form-label required">Company Name</label>
            <input
              type="text"
              id="companyName"
              placeholder="Company name"
              [formField]="form.companyName"
              class="form-control"
            />
            <ton-validator-message [field]="form.companyName" validatorName="required"
              >A valid company name is required</ton-validator-message
            >
          </div>
          <div class="mb-3">
            <label for="firstName" class="form-label required">First Name</label>
            <input
              type="text"
              id="firstName"
              placeholder="First name"
              [formField]="form.firstName"
              class="form-control"
            />
            <ton-validator-message [field]="form.firstName" validatorName="required"
              >A valid first name is required</ton-validator-message
            >
          </div>
          <div class="mb-3">
            <label for="lastName" class="form-label required">Last Name</label>
            <input
              type="text"
              id="lastName"
              placeholder="Last name"
              [formField]="form.lastName"
              class="form-control"
            />
            <ton-validator-message [field]="form.lastName" validatorName="required"
              >A valid last name is required</ton-validator-message
            >
          </div>
          <div class="mb-3">
            <label for="email" class="form-label required">Email Address</label>
            <input
              type="text"
              id="email"
              placeholder="Email"
              [formField]="form.email"
              class="form-control"
            />
            <ton-validator-message [field]="form.email"
              >A valid email address is required</ton-validator-message
            >
          </div>
          <div class="mb-3">
            <label for="password" class="form-label required">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Password"
              [formField]="form.password"
              class="form-control"
            />
            <ton-validator-message [field]="form.password" validatorName="required"
              >A valid password is required</ton-validator-message
            >
            <ton-validator-message [field]="form.password" validatorName="minlength"
              >Password must be at least 8 characters</ton-validator-message
            >
          </div>
          <div class="mb-3">
            <label for="confirmpassword" class="form-label">Confirm Password</label>
            <input
              type="password"
              id="confirmpassword"
              placeholder="Password"
              [formField]="form.confirmPassword"
              class="form-control"
            />
            <ton-validator-message [field]="form.confirmPassword" validatorName="notMatched"
              >The password must match</ton-validator-message
            >
          </div>

          <div class="form-footer">
            <button
              type="button"
              class="btn btn-primary w-100"
              [disabled]="submitting()"
              (click)="register()"
            >
              Create
            </button>
          </div>
        </form>
      </div>
    </ton-card>
    <div class="text-center text-secondary mt-3">
      Already have an account? <a routerLink="/">Sign in</a>
    </div>
  </div>
</div>
